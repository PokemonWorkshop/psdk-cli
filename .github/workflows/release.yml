name: Release Gem

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  release:
    name: Release Gem to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'
          bundler-cache: true

      - name: Release Gem
        uses: rubygems/release-gem@v1
        with:
          setup-trusted-publisher: false
          attestations: false
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
